services:
  mariadb:
    container_name: mariadb
    image: mariadb:inception
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  wordpress:
    container_name: wordpress
    image: wordpress:inception
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - wp-data:/var/www/html
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:inception
    build:
      context: ./requirements/phpmyadmin
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${DOMAIN_NAME}/phpmyadmin/
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx:inception
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wp-data:/var/www/html
      - ssl-data:/etc/nginx/ssl
    networks:
      - inception
    depends_on:
      - wordpress
      - phpmyadmin
    restart: unless-stopped

networks:
  inception:
    driver: bridge

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mysql
  wp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress
  ssl-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SSL_PATH}
