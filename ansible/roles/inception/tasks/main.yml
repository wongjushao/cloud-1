---
- name: Reset SSH connection to apply docker group membership
  ansible.builtin.meta: reset_connection

- name: Create deployment directory
  ansible.builtin.file:
    path: "{{ inception_deploy_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create persistent data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ data_path }}/mysql"
    - "{{ data_path }}/wordpress"
    - "{{ ssl_path }}"

- name: Sync application source files
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/../../srcs/"
    dest: "{{ inception_deploy_dir }}/srcs/"
    private_key: "{{ ansible_ssh_private_key_file }}"
    rsync_opts:
      - "--exclude=.env"
  register: src_sync
  delegate_to: localhost
  become: false

- name: Check if Inception Docker images exist
  ansible.builtin.command:
    cmd: docker image inspect mariadb:inception wordpress:inception nginx:inception phpmyadmin:inception
  register: images_check
  failed_when: false
  changed_when: false
  become_user: "{{ ansible_user }}"

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ inception_deploy_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  register: env_deploy

- name: Show site URL configured for this host
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: DOMAIN_NAME={{ ansible_host }}"

- name: Build Docker images
  ansible.builtin.command:
    cmd: docker compose --env-file ../.env build
    chdir: "{{ inception_deploy_dir }}/srcs"
  register: compose_build
  when: src_sync.changed or images_check.rc != 0
  changed_when: compose_build.rc == 0 and ('Built' in compose_build.stderr or 'built' in compose_build.stdout)
  become_user: "{{ ansible_user }}"

- name: Start Docker stack
  ansible.builtin.command:
    cmd: "docker compose --env-file ../.env up -d{{ ' --force-recreate' if env_deploy.changed else '' }}"
    chdir: "{{ inception_deploy_dir }}/srcs"
  register: compose_up
  changed_when: >
    compose_up.rc == 0 and (
      env_deploy.changed or
      'Creating' in compose_up.stderr or
      'Starting' in compose_up.stderr or
      'Recreating' in compose_up.stderr or
      'Pulling' in compose_up.stderr
    )
  become_user: "{{ ansible_user }}"

- name: Wait for MariaDB to become healthy
  ansible.builtin.command:
    cmd: docker inspect --format='{{ "{{" }}.State.Health.Status{{ "}}" }}' mariadb
    chdir: "{{ inception_deploy_dir }}/srcs"
  register: mariadb_health
  until: mariadb_health.stdout == "healthy"
  retries: 30
  delay: 5
  changed_when: false
  become_user: "{{ ansible_user }}"

- name: Show deployment status
  ansible.builtin.command:
    cmd: docker compose --env-file ../.env ps
    chdir: "{{ inception_deploy_dir }}/srcs"
  register: compose_ps
  changed_when: false
  become_user: "{{ ansible_user }}"

- name: Display service status
  ansible.builtin.debug:
    msg: "{{ compose_ps.stdout_lines }}"

- name: Display site URL
  ansible.builtin.debug:
    msg: "Site available at https://{{ ansible_host }}/ (phpMyAdmin at https://{{ ansible_host }}/phpmyadmin/)"
